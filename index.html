<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoService Pro DB</title>
    
    <!-- PWA Primary Meta Tags -->
    <meta name="theme-color" content="#2563eb">
    <meta name="description" content="Profesionální systém pro správu servisu s plnou podporou offline režimu">
    <link rel="manifest" href="manifest.json">
    
    <!-- iOS support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AutoServis">
    <link rel="apple-touch-icon" href="https://cdn.jsdelivr.net/gh/lucide-react/lucide@latest/icons/wrench.svg">
    
    <script>
        window.process = { env: {} };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            -webkit-tap-highlight-color: transparent;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        @media print {
            @page {
                margin: 5mm;
                size: A4;
            }
            body, html, #root, main {
                background: white !important;
                color: black !important;
                margin: 0 !important;
                padding: 0 !important;
                height: auto !important;
                overflow: visible !important;
            }
            .no-print {
                display: none !important;
            }
            header {
                display: none !important;
            }
            /* Skrytí modálního pozadí a stínů při tisku */
            .fixed.inset-0 {
                position: relative !important;
                display: block !important;
                background: transparent !important;
                backdrop-filter: none !important;
                padding: 0 !important;
            }
            /* Zajištění, že tiskový blok je vidět a nezalamuje se špatně */
            .print-block {
                display: block !important;
                width: 200mm !important;
                margin: 0 auto !important;
                padding: 0 !important;
                box-shadow: none !important;
                border: none !important;
                overflow: visible !important;
            }
            /* Skrytí ostatních elementů uvnitř main během tisku */
            main > div > div:not(.print-block):not(:has(.print-block)) {
                display: none !important;
            }
            /* Odstranění stínů a scrollbarů u všech tiskových šablon */
            .shadow-2xl, .shadow-xl, .shadow-lg, .shadow-md, .shadow-sm {
                box-shadow: none !important;
            }
            .custom-scrollbar, .overflow-y-auto, .overflow-x-auto {
                overflow: visible !important;
            }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.37.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "path": "https://esm.sh/path@^0.12.7",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "xlsx": "https://esm.sh/xlsx@0.18.5"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const swPath = 'sw.js'; 
          navigator.serviceWorker.register(swPath)
            .then(reg => {
              console.log('Service Worker registered with scope:', reg.scope);
            })
            .catch(err => {
              console.warn('Service Worker registration failed.', err);
            });
        });
      }
    </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
